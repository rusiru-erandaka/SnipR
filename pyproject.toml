[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sniplite"
version = "0.1.3"
description = "A lightweight Wayland screenshot and annotation tool"
requires-python = ">=3.10"

[project.scripts]
sniplite = "sniplite.ui:main"

[tool.setuptools]
packages = ["sniplite"]
