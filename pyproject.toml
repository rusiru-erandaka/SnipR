[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "snipr"
version = "0.2.1"
description = "A lightweight Wayland screenshot and annotation tool"
requires-python = ">=3.10"

[project.scripts]
snipr = "snipr.ui:main"

[tool.setuptools]
packages = ["snipr"]
